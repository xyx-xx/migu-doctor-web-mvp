<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf3ec">
  <meta name="description" content="咪咕医生根据已填写的猫狗健康信息补充追问，并生成风险行动提示与可复制的就诊沟通摘要。">
  <meta name="referrer" content="no-referrer">
  <title>风险提示与沟通摘要｜咪咕医生</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css?v=20260828">
</head>
<body>
  <main class="app-shell" id="appShell">
    <header class="site-header">
      <a class="wordmark" href="index.html" aria-label="咪咕医生首页">
        <span class="brand-symbol" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.2 10.2c-1.5-.6-2.2-2.2-1.6-3.5.5-1.2 1.8-1.7 3-.9 1.1.7 1.4 2.5.6 3.7M16.8 10.2c1.5-.6 2.2-2.2 1.6-3.5-.5-1.2-1.8-1.7-3-.9-1.1.7-1.4 2.5-.6 3.7"/><path d="M12 9.2c-3.4 0-6.4 2.5-6.4 5.5 0 2.1 1.6 3.6 3.7 3.6 1.1 0 1.8-.5 2.7-.5s1.6.5 2.7.5c2.1 0 3.7-1.5 3.7-3.6 0-3-3-5.5-6.4-5.5Z"/><path d="M12 13.1v2.2M10.9 14.2h2.2"/></svg>
        </span>
        <span class="wordmark-copy"><strong>咪咕医生</strong><span>PET TRIAGE GUIDE</span></span>
      </a>
      <span class="service-badge" data-service-status><span data-service-label>正在检查服务</span></span>
    </header>

    <header class="page-header">
      <a class="back-link" href="consult.html" aria-label="返回修改症状信息">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <div class="page-title"><h1>风险提示与沟通摘要</h1><p>AI 负责补充整理，确定性危险规则始终优先</p></div>
      <div class="page-actions"><a class="text-button" href="consult.html">修改资料</a></div>
    </header>

    <section class="case-card" id="caseCard" aria-labelledby="case-title" hidden>
      <div class="case-card-head">
        <div class="case-card-title">
          <span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h6M9 9h6M9 13h4"/><path d="M7 3h10a2 2 0 0 1 2 2v16H5V5a2 2 0 0 1 2-2Z"/></svg></span>
          <span><strong id="case-title">就诊沟通卡</strong><small id="caseTime">CURRENT CASE</small></span>
        </div>
        <button class="text-button" id="copyCase" type="button">复制摘要</button>
      </div>
      <div class="case-card-body" id="caseBody"></div>
    </section>

    <div class="info-note" id="processNote" style="margin-top:14px">
      接下来只补充 2–3 个关键问题。回答“不确定”也可以；如果出现新危险信号，请停止等待并立即联系兽医。
    </div>

    <section class="section-block chat-stack" id="chat" aria-live="polite" aria-busy="false"></section>

    <section class="section-block page-card" aria-labelledby="safety-reminder-title">
      <p class="card-kicker">SAFETY REMINDER</p>
      <h2 id="safety-reminder-title">任何时候都不要等待这些信号</h2>
      <p class="card-intro">明显呼吸费力、持续抽搐、失去意识、无法站立、大量出血、完全尿不出来，或腹部突然胀大并持续干呕。</p>
      <div class="button-row">
        <a class="button-danger" href="emergency.html?fresh=1">查看紧急行动步骤</a>
        <a class="button-secondary" href="https://www.amap.com/search?query=24%E5%B0%8F%E6%97%B6%E5%AE%A0%E7%89%A9%E5%8C%BB%E9%99%A2" target="_blank" rel="noopener noreferrer">在地图中搜索医院</a>
      </div>
    </section>

    <p class="footer-note"><span>结果是风险行动提示，不是诊断或处方；AI 内容未经过实时兽医审核。</span></p>
  </main>

  <form class="composer" id="composer" hidden>
    <label class="visually-hidden" for="userInput">继续提问</label>
    <input id="userInput" type="text" maxlength="300" autocomplete="off" placeholder="继续问一个与当前情况有关的问题">
    <button id="sendButton" type="submit">发送</button>
  </form>

  <script src="assets/app.js?v=20260828"></script>
  <script>
    (function () {
      "use strict";

      const {
        apiAssist,
        appendMessage,
        buildConsultSummary,
        byId,
        copyText,
        detectDangerSignals,
        formatDateTime,
        getServiceHealth,
        getStoredJson,
        setStoredJson,
        showInlineError,
        storeEmergencySignals,
      } = window.MiguApp;

      const chat = byId("chat");
      const composer = byId("composer");
      const appShell = byId("appShell");
      const input = byId("userInput");
      const sendButton = byId("sendButton");
      const fallbackQuestions = [
        "现在精神状态和活动量，与平时相比有什么变化？",
        "有没有呕吐、呼吸费力、疼痛表现，或者症状快速加重？",
        "症状出现后，能否正常喝水并把水留住？",
      ];
      const riskOrder = { OBSERVE_WITH_GUARDRAILS: 1, CONTACT_VET_NOW: 2, EMERGENCY_NOW: 3 };
      const messages = [];
      let consultData = null;
      let answers = [];
      let pending = false;
      let triageFinished = false;
      let latestResult = null;
      let caseSummary = "";
      let aiProcessingAllowed = false;

      function setPending(value) {
        pending = value;
        chat.setAttribute("aria-busy", value ? "true" : "false");
        input.disabled = value;
        sendButton.disabled = value;
        document.querySelectorAll(".quick-prompt").forEach((button) => { button.disabled = value; });
      }

      function redirectIfDanger(text, extraSignals = []) {
        const signals = [...detectDangerSignals(text), ...extraSignals];
        if (!signals.length) return false;
        storeEmergencySignals(signals);
        window.location.href = "emergency.html";
        return true;
      }

      function localRiskFloor(data, answerText = "") {
        if (detectDangerSignals([data.symptom, data.other, data.recent, answerText].join("。")).length) return "EMERGENCY_NOW";
        if (["用力但只有很少", "完全无尿"].includes(data.urination)) return "EMERGENCY_NOW";
        if (
          data.trend === "正在加重" ||
          data.drinking === "喝水也会吐" ||
          data.eating === "完全不吃" ||
          data.drinking === "完全不喝" ||
          data.defecation === "便血或黑便" ||
          data.duration === "超过一周" ||
          /频繁|反复|持续/.test(`${data.frequency} ${data.symptom}`)
        ) return "CONTACT_VET_NOW";
        return "OBSERVE_WITH_GUARDRAILS";
      }

      function higherRisk(first, second) {
        return riskOrder[first] >= riskOrder[second] ? first : second;
      }

      function safeFallbackResult(reason) {
        return {
          risk: "CONTACT_VET_NOW",
          riskLabel: "当前无法安全完成线上评估，请尽快联系兽医",
          rationale: reason || "缺少模型回复或远程信息不足，不能据此排除需要面诊的情况。",
          actions: "把沟通摘要复制给医院；记录精神、吃喝、排尿排便和症状变化；不要自行用药、催吐或强行喂食喂水。",
          emergencySigns: "若出现呼吸费力、抽搐、意识异常、无法站立、大量出血、完全无尿或快速恶化，请立即前往可接诊医院。",
          source: "local-fallback",
        };
      }

      function normalizeResult(result, answerText) {
        const validRisks = Object.keys(riskOrder);
        if (!result || !validRisks.includes(result.risk)) return safeFallbackResult("模型结果格式不完整，已按保守规则处理。");
        const floor = localRiskFloor(consultData, answerText);
        const risk = higherRisk(result.risk, floor);
        const labels = {
          OBSERVE_WITH_GUARDRAILS: "目前未发现明确急症信号，可在护栏下继续观察",
          CONTACT_VET_NOW: "建议尽快联系执业兽医确认",
          EMERGENCY_NOW: "存在明确危险信号，请立即就医",
        };
        return {
          risk,
          riskLabel: risk === result.risk && result.riskLabel ? result.riskLabel : labels[risk],
          rationale: String(result.rationale || "远程信息有限，当前判断仅用于下一步行动准备。"),
          actions: Array.isArray(result.actions)
            ? result.actions.map(String).join("\n")
            : String(result.actions || "继续记录症状变化；不确定或加重时尽快联系兽医。"),
          emergencySigns: Array.isArray(result.emergencySigns)
            ? result.emergencySigns.map(String).join("；")
            : String(result.emergencySigns || "呼吸费力、抽搐、意识异常、无法站立、大量出血、完全无尿或快速恶化时立即就医。"),
          source: result.source || "server-reviewed",
        };
      }

      function splitActions(text) {
        const parts = String(text || "")
          .split(/\n+|(?:\d+[.、]\s*)|[；;]/)
          .map((item) => item.replace(/^[-•]\s*/, "").trim())
          .filter(Boolean);
        return parts.length ? parts.slice(0, 5) : ["记录症状变化，并联系执业兽医确认下一步。"];
      }

      function riskPresentation(risk) {
        if (risk === "EMERGENCY_NOW") return { className: "risk-high", code: "EMERGENCY NOW", action: "立即就医" };
        if (risk === "CONTACT_VET_NOW") return { className: "risk-mid", code: "CONTACT VET", action: "尽快联系" };
        return { className: "risk-low", code: "OBSERVE WITH GUARDRAILS", action: "护栏下观察" };
      }

      function addTextElement(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        node.textContent = text;
        return node;
      }

      function renderResult(result, persist = true) {
        const presentation = riskPresentation(result.risk);
        const panel = document.createElement("section");
        panel.className = "result-panel";
        panel.setAttribute("aria-label", "风险行动提示");

        const hero = document.createElement("div");
        hero.className = `risk-hero ${presentation.className}`;
        hero.append(
          addTextElement("span", "risk-label", presentation.code),
          addTextElement("h2", "", result.riskLabel),
          addTextElement("p", "", result.rationale)
        );

        const body = document.createElement("div");
        body.className = "result-body";
        const actionsSection = document.createElement("div");
        actionsSection.className = "result-section";
        actionsSection.appendChild(addTextElement("h3", "", "现在怎么做"));
        const list = document.createElement("ol");
        list.className = "action-list";
        splitActions(result.actions).forEach((action) => list.appendChild(addTextElement("li", "", action)));
        actionsSection.appendChild(list);

        const guardSection = document.createElement("div");
        guardSection.className = "result-section";
        guardSection.append(addTextElement("h3", "", "出现这些情况立即就医"), addTextElement("p", "", result.emergencySigns));
        body.append(actionsSection, guardSection);

        const actionBar = document.createElement("div");
        actionBar.className = "result-actions";
        const copyButton = addTextElement("button", "button", "复制完整摘要给兽医");
        copyButton.type = "button";
        copyButton.addEventListener("click", async () => {
          const fullText = `${buildConsultSummary(consultData, answers)}\n\n风险行动：${result.riskLabel}\n判断依据：${result.rationale}\n现在怎么做：${result.actions}\n立即就医如果：${result.emergencySigns}`;
          const copied = await copyText(fullText);
          copyButton.textContent = copied ? "已复制，可直接发送" : "复制失败，请长按摘要";
          window.setTimeout(() => { copyButton.textContent = "复制完整摘要给兽医"; }, 1900);
        });
        const hospital = addTextElement("a", result.risk === "EMERGENCY_NOW" ? "button-danger" : "button-secondary", "在地图中搜索宠物医院");
        hospital.href = "https://www.amap.com/search?query=24%E5%B0%8F%E6%97%B6%E5%AE%A0%E7%89%A9%E5%8C%BB%E9%99%A2";
        hospital.target = "_blank";
        hospital.rel = "noopener noreferrer";
        const restart = addTextElement("a", "button-secondary", "开始新的问诊");
        restart.href = "consult.html?new=1";
        if (result.risk === "EMERGENCY_NOW") actionBar.append(hospital, copyButton, restart);
        else actionBar.append(copyButton, hospital, restart);

        panel.append(hero, body, actionBar);
        chat.appendChild(panel);
        panel.scrollIntoView({ block: "start", behavior: "smooth" });
        latestResult = result;
        if (persist) {
          setStoredJson("consultResult", {
            caseCreatedAt: consultData?.createdAt || "",
            result,
          });
        }
        triageFinished = true;
        composer.hidden = false;
        appShell.classList.add("with-composer");
        byId("processNote").textContent = `风险提示已生成 · ${result.source === "local-fallback" ? "当前使用本地保守兜底" : "已通过服务端格式与安全校验"}`;
      }

      function showQuestionForm(questions, usedFallback) {
        const form = document.createElement("form");
        form.className = "question-form";
        form.setAttribute("aria-label", "补充问诊信息");

        const header = document.createElement("div");
        header.className = "question-form-header";
        header.append(
          addTextElement("strong", "", "还需要确认几个关键信息"),
          addTextElement("span", "", usedFallback ? "本次使用本地固定安全问题，不会把病例发送给 AI。" : "这些问题会帮助结果更具体；不知道可以直接写“不确定”。")
        );
        form.appendChild(header);

        questions.forEach((question, index) => {
          const field = document.createElement("div");
          field.className = "field";
          const label = document.createElement("label");
          const inputId = `followUp${index}`;
          label.htmlFor = inputId;
          label.textContent = `${index + 1}. ${question}`;
          const answer = document.createElement("input");
          answer.id = inputId;
          answer.type = "text";
          answer.maxLength = 240;
          answer.autocomplete = "off";
          answer.placeholder = "不知道可填写“不确定”";
          field.append(label, answer);
          form.appendChild(field);
        });

        const submit = addTextElement("button", "button", "提交补充信息并生成提示");
        submit.type = "submit";
        form.appendChild(submit);

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          if (pending) return;
          answers = questions.map((question, index) => ({ question, answer: byId(`followUp${index}`).value.trim() || "不确定" }));
          const answerText = answers.map((item, index) => `${index + 1}. ${item.question}\n回答：${item.answer}`).join("\n");
          const safetyText = answers.map((item) => item.answer).join("。");
          if (redirectIfDanger(safetyText)) return;
          setStoredJson("consultAnswers", answers);
          form.remove();
          appendMessage(chat, answerText, "user");
          messages.push({ role: "assistant", content: questions.map((question, index) => `${index + 1}. ${question}`).join("\n") });
          messages.push({ role: "user", content: answerText });
          await requestTriageResult(answerText, safetyText);
        });

        chat.appendChild(form);
        form.querySelector("input")?.focus();
        form.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }

      async function requestQuestions() {
        if (pending) return;
        if (!aiProcessingAllowed) {
          showQuestionForm(fallbackQuestions, true);
          return;
        }
        setPending(true);
        const loading = appendMessage(chat, "正在整理需要补充的信息", "ai loading");
        let questions = fallbackQuestions;
        let usedFallback = false;
        try {
          const result = await apiAssist("triage_questions", messages);
          if (Array.isArray(result.questions) && result.questions.length >= 2) questions = result.questions.slice(0, 3).map(String);
          else usedFallback = true;
        } catch {
          usedFallback = true;
        } finally {
          loading.remove();
          setPending(false);
        }
        showQuestionForm(questions, usedFallback);
      }

      async function requestTriageResult(answerText, safetyText = answerText) {
        if (pending) return;
        if (!aiProcessingAllowed) {
          renderResult(safeFallbackResult("本次问诊没有授权发送给 AI，已按本地保守规则处理。"));
          return;
        }
        setPending(true);
        const loading = appendMessage(chat, "正在生成风险行动提示", "ai loading");
        let result;
        try {
          result = normalizeResult(await apiAssist("triage_result", messages), safetyText);
        } catch {
          result = safeFallbackResult("AI 辅助服务当前未连接，远程信息有限，不能据此排除需要面诊的情况。");
        } finally {
          loading.remove();
          setPending(false);
        }
        if (result.risk === "EMERGENCY_NOW") {
          const detected = detectDangerSignals([consultData.symptom, consultData.other, safetyText].join("。"));
          if (detected.length) return redirectIfDanger("", detected);
        }
        renderResult(result);
      }

      async function sendFollowUp(text, appendUserMessage) {
        if (!text || pending || !triageFinished) return;
        if (redirectIfDanger(text)) return;
        if (!aiProcessingAllowed) {
          if (appendUserMessage) appendMessage(chat, text, "user");
          appendMessage(chat, "本次问诊保持本地处理，没有把病例发送给 AI。远程信息不足，无法安全回答这个个体化追问；请把上方摘要发给执业兽医，状态加重或拿不准时直接联系医院。", "ai");
          return;
        }
        setPending(true);
        if (appendUserMessage) appendMessage(chat, text, "user");
        const loading = appendMessage(chat, "正在回复", "ai loading");
        const recent = messages.slice(-4);
        const resultContext = [
          `已经展示的风险级别：${latestResult.risk}（${latestResult.riskLabel}）`,
          `判断依据：${latestResult.rationale}`,
          `当前行动：${latestResult.actions}`,
          `立即就医信号：${latestResult.emergencySigns}`,
        ].join("\n");
        const request = [...recent, { role: "assistant", content: resultContext }, { role: "user", content: text }];
        try {
          const result = await apiAssist("triage_followup", request);
          const reply = String(result.text || "").trim();
          if (!reply) throw new Error("empty");
          loading.remove();
          appendMessage(chat, reply, "ai");
          messages.push({ role: "user", content: text }, { role: "assistant", content: reply });
        } catch (error) {
          loading.remove();
          showInlineError(chat, "这次没有收到可靠回复。请不要等待服务恢复；状态加重或拿不准时直接联系兽医。", () => sendFollowUp(text, false));
        } finally {
          setPending(false);
        }
      }

      composer.addEventListener("submit", (event) => {
        event.preventDefault();
        if (pending || !triageFinished) return;
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        sendFollowUp(text, true);
      });

      byId("copyCase").addEventListener("click", async () => {
        const copied = await copyText(buildConsultSummary(consultData, answers));
        byId("copyCase").textContent = copied ? "摘要已复制" : "复制失败";
        window.setTimeout(() => { byId("copyCase").textContent = "复制摘要"; }, 1700);
      });

      document.addEventListener("DOMContentLoaded", async () => {
        consultData = getStoredJson("consultData", null);
        answers = getStoredJson("consultAnswers", []);
        if (!consultData || !String(consultData.symptom || "").trim()) {
          byId("processNote").hidden = true;
          appendMessage(chat, "还没有找到本次症状资料。请先完成风险分流表单，再生成沟通摘要。", "system");
          const link = addTextElement("a", "button", "去填写症状资料");
          link.href = "consult.html";
          chat.appendChild(link);
          return;
        }

        const structuredSignals = ["用力但只有很少", "完全无尿"].includes(consultData.urination)
          ? [{ id: "urinary", label: "用力排尿却只有很少，或完全无尿" }]
          : [];
        if (redirectIfDanger([consultData.symptom, consultData.other, consultData.recent].join("。"), structuredSignals)) return;

        caseSummary = buildConsultSummary(consultData, []);
        byId("caseBody").textContent = caseSummary;
        byId("caseTime").textContent = `CASE · ${formatDateTime(new Date(consultData.createdAt || Date.now()))}`;
        byId("caseCard").hidden = false;
        messages.push({ role: "user", content: caseSummary });
        const health = await getServiceHealth();
        const modelConfigured = Boolean(health.configured ?? health.modelConfigured);
        aiProcessingAllowed = modelConfigured
          && consultData.aiProcessingAuthorized === true
          && consultData.processingMode === "ai-authorized";
        if (modelConfigured && !aiProcessingAllowed) {
          byId("processNote").textContent = "本次病例没有可验证的 AI 授权，将只使用本地固定安全问题和保守提示，不会发送给模型。";
        } else if (!modelConfigured) {
          byId("processNote").textContent = "当前没有配置 AI，将使用本地固定安全问题和保守提示；危险规则仍然优先。";
        }
        const saved = getStoredJson("consultResult", null);
        if (saved && saved.caseCreatedAt === (consultData.createdAt || "") && saved.result) {
          if (Array.isArray(answers) && answers.length) {
            const questionsText = answers.map((item, index) => `${index + 1}. ${item.question}`).join("\n");
            const answersText = answers.map((item, index) => `${index + 1}. ${item.question}\n回答：${item.answer}`).join("\n");
            appendMessage(chat, answersText, "user");
            messages.push({ role: "assistant", content: questionsText }, { role: "user", content: answersText });
          }
          renderResult(saved.result, false);
          if (!aiProcessingAllowed) {
            byId("processNote").textContent += " · 后续问题保持本地处理";
          }
          return;
        }
        requestQuestions();
      });
    })();
  </script>
</body>
</html>
